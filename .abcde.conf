# Use MusicBrainz for looking up track data, fallback to GnuDB
CDDBMETHOD=musicbrainz,cddb
CDDBURL="http://gnudb.org"

# Define where you want the music saved
OUTPUTDIR="$HOME/Music"

# Folder format: Artist / Year - Album / Track - Title
OUTPUTFORMAT='${ARTISTFILE}/${CDYEAR} - ${ALBUMFILE}/${TRACKNUM} - ${TRACKFILE}'
VAOUTPUTFORMAT='Various Artists/${CDYEAR} - ${ALBUMFILE}/${TRACKNUM} - ${ARTISTFILE} - ${TRACKFILE}'

# Allow spaces in filenames (removes underscore replacement)
# This keeps the safety strip for control/illegal characters but leaves spaces untouched
MUNGECHARS='[:cntrl:]" ?*|\\/<>^'

EJECTCD=y
