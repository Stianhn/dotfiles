# Use MusicBrainz for looking up track data, fallback to GnuDB
CDDBMETHOD=musicbrainz,cddb
CDDBURL="http://gnudb.org"

# Define where you want the music saved
OUTPUTDIR="$HOME/Music"

# The path structure: Artist - Album/Track - Title
OUTPUTFORMAT='${ARTISTFILE} - ${ALBUMFILE}/${TRACKNUM} - ${TRACKFILE}'
VAOUTPUTFORMAT='Various Artists - ${ALBUMFILE}/${TRACKNUM} - ${ARTISTFILE} - ${TRACKFILE}'

# Keep things tidy by replacing spaces with underscores (optional, delete if you like spaces)
MUNGECHARS='[:cntrl:]" ?*|\\/<>^'

# Eject the CD when done
EJECTCD=y

